<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<style type="text/css">
.container{
   margin-top: 50px;
}
.row {
  margin: 0px auto;
  width: 960px;
}
p {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.a-link{
  cursor: pointer;
}
</style>
<script src="https://unpkg.com/vue@3.3.4/dist/vue.global.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script src="https://unpkg.com/vue-demi"></script>
<script src="https://unpkg.com/pinia@2.1.7/dist/pinia.iife.prod.js"></script>
</head>
<body>
   <div class="container">
     <div class="row">
       <div class="col-sm-3" v-for="(vo,index) in store.list" :key="index">
         <a :href="'http://localhost:8080/recipe/detail?no='+vo.no">
          <div class="thumbnail">
            <img :src="vo.poster"
                 :title="vo.title" 
                 style="width: 240px;height: 130px">
            <p>{{vo.chef}}</p>
          </div>
         </a>
       </div>
     </div>
     <div class="row text-center" style="margin-top: 10px">
       <ul class="pagination">
         <li v-if="store.startPage>1">
           <a class="a-link" @click="store.move(store.startPage-1)">&laquo;</a>
         </li>
         
         <li v-for="(i,index) in store.range" :key="index"
             :class="i===store.curpage?'active':''"
         >
           <a class="a-link" @click="store.move(i)">{{i}}</a>
         </li>
         
         <li v-if="store.endPage<store.totalpage">
          <a class="a-link" @click="store.move(store.endPage+1)">&raquo;</a>
         </li>
       </ul>
     </div> 
   </div>
   <script src="/vue/axios.js"></script>
   <script src="/vue/recipe/recipeStore.js"></script>
   <script>
    const {createApp,onMounted,ref} = Vue
    const {createPinia}=Pinia
    const recipeApp=createApp({
    	setup(){
    		const store=useRecipeStore();
    		onMounted(()=>{
    			store.recipeListData()
    		})
    		
    		return {
    			store
    		}
    	}
    })
    recipeApp.use(createPinia())
    recipeApp.mount(".container")
   </script>
</body>
</html>
